name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Install build tools
        run: brew install xcodegen swiftlint
      - name: Lint
        run: swiftlint lint --strict
      - name: Core tests
        run: xcrun swift test --parallel
      - name: Generate project
        run: xcodegen generate
      - name: Select simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | ruby -rjson -e '
            devices = JSON.parse(STDIN.read).fetch("devices")
            phone = devices.select { |runtime, _| runtime.include?("iOS") }
                           .values.flatten.find { |device| device.fetch("name").include?("iPhone") }
            abort "No iPhone simulator is installed" unless phone
            puts phone.fetch("udid")
          ')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Build and test app and extensions
        run: |
          xcodebuild test \
            -project PocketQueue.xcodeproj \
            -scheme PocketQueue \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGN_IDENTITY=-
      - name: Build free-signing standalone variant
        run: |
          xcodebuild build \
            -project PocketQueue.xcodeproj \
            -scheme PocketQueueLocal \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/LocalDerivedData \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-test-results
          path: build/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
